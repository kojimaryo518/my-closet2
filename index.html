<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MY CLOSET</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f3;color:#242424;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:1040px;margin:auto;padding:22px 16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;letter-spacing:1px;margin:0}small,.muted{color:#888}.count{font-size:22px;font-weight:700}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}.tabs button{border:1px solid #ddd;border-radius:30px;background:#fff;padding:10px 15px;cursor:pointer}.tabs button.active{background:#272727;color:white}.search{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:12px;background:white;font-size:15px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid #e8e8e8;border-radius:15px;padding:11px;text-align:left;cursor:pointer;color:inherit;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;object-position:center;background:white;border-radius:10px}.card .num{font-size:12px;color:#999;margin-top:8px}.card .brand{font-weight:700;font-size:14px;margin-top:3px}.card .name{font-size:13px;color:#666;margin-top:5px;min-height:34px}.card .more{font-size:12px;color:#555;margin-top:8px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.open{display:flex}.modal{background:white;border-radius:20px;max-width:680px;width:100%;max-height:94vh;overflow:auto;padding:20px;position:relative}.close{position:absolute;right:15px;top:13px;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.hero{width:100%;height:min(54vh,430px);object-fit:contain;background:#fff}.details{width:100%;border-collapse:collapse;margin-top:16px}.details td{border-bottom:1px solid #eee;padding:11px 6px;font-size:14px}.details td:first-child{width:30%;color:#888}h2{font-size:21px;margin:12px 0 5px}.note{font-size:12px;color:#888;line-height:1.6;margin-top:16px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wrap{padding:16px 11px}.card{padding:8px}.card .brand{font-size:12px}.card .name{font-size:12px}.modal{padding:12px}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #806344;outline-offset:3px}.wrap{padding-top:40px;padding-bottom:48px}header{padding-bottom:22px;border-bottom:1px solid #dfded9}h1{letter-spacing:3px;font-size:28px}small,.muted,.note{color:#68645e}.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px #2820160d}.card img{object-fit:contain;background:#faf9f7}.card .num{color:#706c65}.card .more{color:#725739}.tabs button{min-height:44px}.close{z-index:1;min-width:44px;min-height:44px}.modal{overscroll-behavior:contain}.card .brand,.card .name{overflow-wrap:anywhere}.hero{margin-top:28px}@media(prefers-reduced-motion:reduce){.card{transition:none}}@media(max-width:600px){h1{font-size:24px}.wrap{padding-top:24px}.tabs{gap:6px}.tabs button{padding:9px 12px}.card .brand{font-size:13px}.card .name{line-height:1.6}.modal{max-height:90dvh}}</style></head><body><main class="wrap"><header><div><h1>MY CLOSET</h1><small>マイ・クローゼット</small></div><div><div class="count">10着</div><small>登録済み</small></div></header><nav class="tabs" id="tabs" aria-label="カテゴリー"></nav><label class="sr-only" for="search">洋服を検索</label><input type="search" id="search" class="search" placeholder="ブランド・商品名・色で検索"><p id="results" class="muted" role="status" aria-live="polite"></p><div id="grid" class="grid"></div><p class="note">一覧の商品画像は送付写真を参考に生成したイメージです。元の写真と細部が異なる場合があります。</p></main><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"><button id="close" class="close" aria-label="閉じる">×</button><div id="modalbody"></div></section></div><script>const items=[{"n": 1, "brand": "CIAOPANIC", "name": "モンスター柄プリントロンT", "cat": "Tシャツ", "color": "チャコールグレー", "size": "未確認", "sku": "未確認", "features": "プリント入り、長袖、クルーネック", "status": "未特定", "img": "assets/item-001-full.jpg"}, {"n": 2, "brand": "ZARA", "name": "STRIPED RELAXED FIT SWEATER", "cat": "ニット", "color": "グレージュ × ダークグレー", "size": "M", "sku": "9598/321/700", "features": "細ボーダー、クルーネック", "status": "品番確認済み", "img": "assets/item-002-full.jpg"}, {"n": 3, "brand": "Provolone", "name": "チャコール×ブラウン ボーダーニット", "cat": "ニット", "color": "チャコール × ブラウン", "size": "未確認", "sku": "未確認", "features": "再生ポリエステル50%、ポリエステル30%、ナイロン20%", "status": "未特定", "img": "assets/item-003-full.jpg"}, {"n": 4, "brand": "ZARA", "name": "細チェック柄フラップポケットシャツ", "cat": "シャツ", "color": "グレー × ネイビー", "size": "未確認", "sku": "未確認", "features": "長袖、両胸フラップポケット", "status": "未特定", "img": "assets/item-004-full.jpg"}, {"n": 5, "brand": "JOURNAL STANDARD relume", "name": "ブルーグレーチェックシャツ", "cat": "シャツ", "color": "ブルーグレー × ホワイト", "size": "未確認", "sku": "未確認", "features": "ぼかしチェック、両胸パッチポケット", "status": "未特定", "img": "assets/item-005-full.jpg"}, {"n": 6, "brand": "niko and ... JEANS", "name": "トグル留めデニム調ジャケット", "cat": "アウター", "color": "ウォッシュドブラック", "size": "M", "sku": "未確認", "features": "スタンドカラー、金属トグル留め", "status": "未特定", "img": "assets/item-006-full.jpg"}, {"n": 7, "brand": "niko and ...", "name": "ミックスチェックダブルジャケット", "cat": "アウター", "color": "ブラウン × グレー × ブルー", "size": "L", "sku": "未確認", "features": "ダブルブレスト、ラペルに缶バッジ", "status": "未特定", "img": "assets/item-007-full.jpg"}, {"n": 8, "brand": "BEAMS HEART", "name": "ボア襟レザー調ジャケット", "cat": "アウター", "color": "ブラウン × グレー", "size": "M", "sku": "未確認", "features": "ボア襟、フロントジップ、レザー調", "status": "未特定", "img": "assets/item-008-full.jpg"}, {"n": 9, "brand": "niko and ...", "name": "凹凸チェックプルオーバーシャツ", "cat": "シャツ", "color": "ブルーグレー × ベージュ", "size": "未確認", "sku": "未確認", "features": "サッカー調生地、ハーフボタン、両胸フラップポケット", "status": "未特定", "img": "assets/item-009-full.jpg"},{"n":10,"brand":"G.M.S.（タグ表記）","name":"コーデュロイ襟 ジップワークジャケット（仮称）","cat":"アウター","color":"グレー × ブラウン（襟）","size":"未確認","sku":"未確認","features":"ブラウンのコーデュロイ襟、フロントジップ、胸ジップポケット、左右の斜めポケット、濃色の裏地。胸にGENERAL MERCHANDISE SUPPLYの刺繍","status":"正式商品名・ブランド詳細未特定","img":"assets/item-010-full.jpg","tagImg":"assets/item-010-tag.jpg"}];let active='すべて';const cats=['すべて','Tシャツ','ニット','シャツ','アウター'];const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),search=document.getElementById('search'),overlay=document.getElementById('overlay'),modalBody=document.getElementById('modalbody');function render(){tabs.innerHTML=cats.map(c=>`<button class="${active===c?'active':''}" aria-pressed="${active===c}" data-cat="${c}">${c} (${c==='すべて'?items.length:items.filter(i=>i.cat===c).length})</button>`).join('');const q=search.value.trim().toLowerCase();const filtered=items.filter(i=>(active==='すべて'||i.cat===active)&&[i.brand,i.name,i.color,i.sku].join(' ').toLowerCase().includes(q));document.getElementById('results').textContent=`${filtered.length} / ${items.length} 着`;grid.innerHTML=filtered.map(i=>`<button class="card" data-id="${i.n}"><img loading="lazy" src="${i.img}" alt="${i.brand} ${i.name}"><div class="num">No.${String(i.n).padStart(3,'0')}</div><div class="brand">${i.brand}</div><div class="name">${i.name}</div><div class="more">詳細を見る →</div></button>`).join('')||'<p>該当する服がありません。</p>'}tabs.addEventListener('click',e=>{if(e.target.dataset.cat){active=e.target.dataset.cat;render()}});search.addEventListener('input',render);grid.addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(!card)return;const i=items.find(x=>x.n===+card.dataset.id);modalBody.innerHTML=`<img class="hero" src="${i.img}" alt="${i.brand}"><small>No.${String(i.n).padStart(3,'0')} / ${i.cat}</small><h2 id="detail-title">${i.brand}</h2><div>${i.name}</div><table class="details">${[['カラー',i.color],['サイズ',i.size],['品番',i.sku],['特徴',i.features],['商品特定',i.status]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>${i.tagImg?`<img class="hero" src="${i.tagImg}" alt="ブランドタグの写真">`:""}<p class="note">画像は写真を参考に生成したイメージです。正式商品名が未特定の場合は仮称です。</p>`;lastFocused=card;overlay.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus()});let lastFocused=null;
function closeModal(){overlay.classList.remove('open');document.body.style.overflow='';lastFocused?.focus()}
document.getElementById('close').onclick=closeModal;
overlay.onclick=e=>{if(e.target===overlay)closeModal()};
document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...overlay.querySelectorAll('button,[href],input,[tabindex="0"]')];const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();</script></body></html>
